name: Weekly News Draft (Sunday)

# 토요일 group(weekly-news-draft)과 별개 → 독립 실행
concurrency:
  group: weekly-news-draft-sunday
  cancel-in-progress: false

"on":
  schedule:
    # KST 일요일 09:00 = UTC 일요일 00:00
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN 모드 (true=PR 미생성/검증만, false=정상)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Collect & Open PR (Sunday)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Collect news (Claude API + web_search)
        id: collect
        run: python -m publishers.weekly_news_x.collect

      - name: 🎭 Append comic character voice (optional)
        env:
          APPEND_COMIC_VOICE: ${{ vars.APPEND_COMIC_VOICE }}
        run: python -m publishers.weekly_news_x.comic_voice
        continue-on-error: true

      # weekly_news_x 전용 Notion 적재 (2026-05-18 재활성)
      # DB: 📰 weekly_news_x — 미국 뉴스 브리핑 발행 이력
      # URL: https://www.notion.so/56130cb86f604b1b9f827f20609d21c5
      # 이력:
      #   2026-05-17: 적재 비활성 (전용 DB 미존재로 404 발생) — env 빈 값으로 임시 차단
      #   2026-05-18: 전용 DB 신규 생성 + Integration 연결 완료 → 재활성
      - name: 📚 Sync draft to Notion
        if: env.DRY_RUN != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          STATUS: Draft
        run: python -m publishers.weekly_news_x.notion_sync
        continue-on-error: true

      - name: 📤 Create Pull Request
        id: pr
        if: env.DRY_RUN != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'draft(weekly-news-sun): ${{ steps.collect.outputs.date }}'
          title: '[Weekly-News Draft / Sun] ${{ steps.collect.outputs.date }}'
          body: |
            ## 자동 생성 — Weekly News 초안 (일요일)

            - 파일: `${{ steps.collect.outputs.archive_path }}`
            - 토요일 발행 이후 24시간 변동분 위주
            - 검수 후 **Merge** 시 자동 X 발행 (`weekly_news_publish.yml` 트리거)
            - 폐기: PR Close (X 발행 없음)

            ---

            ⚠️ Merge 전 본문 팩트체크 필수.
          branch: weekly-news-sun/${{ steps.collect.outputs.date }}
          delete-branch: true
          labels: weekly-news-draft

      # v1.4.0 신규 (2026-05-18): Auto-merge — validation 통과 시 PR 자동 머지
      # 도입 배경: 마스터 결정 — X 자동 발행 도입. collect.py가 V1+V2+V3+V4+V5
      #            모두 통과해야 archive 저장 + PR 생성 → 그 PR을 자동 머지
      #            → publish.yml 자동 트리거로 X 발행.
      # 안전장치: PR이 실제 생성된 경우만(`pull-request-url != ''`) 머지 시도.
      #          DRY_RUN 모드에서는 PR 미생성이므로 자동 머지도 미실행.
      # 마스터 거부권: PR에 `do-not-merge` 라벨 부착 시 머지 안 됨 (GitHub 기본 정책).
      #               긴급 차단: publish.yml workflow disable.
      # 롤백: 본 step 전체 주석 처리.
      - name: 🟢 Auto-merge PR (v1.4.0)
        if: env.DRY_RUN != 'true' && steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.pull-request-number }}"
          echo "[auto-merge] PR #${PR_NUM} 즉시 머지 시도 (--squash --delete-branch)"
          gh pr merge "${PR_NUM}" --squash --delete-branch --admin || {
            echo "::warning::auto-merge 실패 — 마스터가 수동 머지 가능"
            exit 0
          }
          echo "✅ Auto-merge 완료 — publish.yml 자동 트리거됨"

      # D3 패치 (2026-05-17): always() + PR step outcome 4분기 처리
      # 도입 배경: 기존 if: success() 는 PR step 실패 시 알림도 차단 → 인지 지연.
      # 분기:
      #   - outcome=skipped (DRY_RUN) → notify_draft_created(dry_run=True)
      #   - outcome=failure          → notify_draft_failure(stage='pr_creation')
      #   - outcome=success & pr_url 있음 → notify_draft_created(dry_run=False)
      #   - outcome=success & pr_url 비어있음 → notify_draft_failure(stage='pr_creation',
      #                                          error='PR outputs empty')
      - name: 📨 Notify draft (Telegram INTERNAL)
        if: always() && steps.collect.outputs.archive_path != ''
        env:
          DRY_RUN_INPUT: ${{ env.DRY_RUN }}
          ARCHIVE_PATH_INPUT: ${{ steps.collect.outputs.archive_path }}
          PR_URL_INPUT: ${{ steps.pr.outputs.pull-request-url }}
          PR_STEP_OUTCOME: ${{ steps.pr.outcome }}
          WEEKDAY_INPUT: ${{ steps.collect.outputs.weekday }}
        run: |
          python -c "
          import os
          pr_outcome = os.environ.get('PR_STEP_OUTCOME', 'success')
          pr_url = os.environ.get('PR_URL_INPUT', '')
          weekday = os.environ.get('WEEKDAY_INPUT', 'Sunday') or 'Sunday'
          dry_run = (os.environ.get('DRY_RUN_INPUT', 'false').lower() == 'true')
          archive_path = os.environ.get('ARCHIVE_PATH_INPUT', '')

          if pr_outcome == 'failure':
              from publishers.weekly_news_x.notifier import notify_draft_failure
              notify_draft_failure(
                  stage='pr_creation',
                  error_msg='collect는 성공했으나 PR 생성 실패. Actions 권한 또는 peter-evans 설정 확인 필요.',
                  weekday=weekday,
              )
          elif pr_outcome == 'success' and not pr_url and not dry_run:
              from publishers.weekly_news_x.notifier import notify_draft_failure
              notify_draft_failure(
                  stage='pr_creation',
                  error_msg='PR step success인데 outputs empty — 변경사항 없음 또는 권한 누락 가능.',
                  weekday=weekday,
              )
          else:
              # success+pr_url 보유 OR skipped(DRY_RUN)
              from publishers.weekly_news_x.notifier import notify_draft_created
              notify_draft_created(
                  archive_path=archive_path,
                  pr_url=pr_url,
                  weekday=weekday,
                  dry_run=dry_run,
              )
          "
        continue-on-error: true

      - name: 📦 Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-news-draft-sun-${{ github.run_number }}
          path: logs/weekly_news/
          retention-days: 14
