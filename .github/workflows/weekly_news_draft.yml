name: Weekly News Draft

# 기존 alert-pipeline 과 별개 group → 동시 실행 가능
concurrency:
  group: weekly-news-draft
  cancel-in-progress: false

"on":
  schedule:
    # KST 토요일 09:00 = UTC 토요일 00:00
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN 모드 (true=PR 미생성/검증만, false=정상)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Collect & Open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Telegram 알림용 (alert.yml 시크릿 재활용)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}
      # cron 실행 시 DRY_RUN=false, workflow_dispatch 시 사용자 입력
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      # 기본 발행 모드: true 시 PR 우회 + 직접 commit + 즉시 publish
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
      # 백업 PR 흐름에서 자동 머지를 별도 제어 (기본 false: 수동 검수 PR)
      AUTO_MERGE_DRAFT_PR: ${{ vars.AUTO_MERGE_DRAFT_PR || 'false' }}

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          # v2.0.0: AUTO_PUBLISH_ENABLED 시 main 직접 commit + push 위해 필요
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Collect news (Claude API + web_search)
        id: collect
        run: python -m publishers.weekly_news_x.collect

      # 옵션: APPEND_COMIC_VOICE Variable 등록 시에만 실제 동작
      - name: 🎭 Append comic character voice (optional)
        env:
          APPEND_COMIC_VOICE: ${{ vars.APPEND_COMIC_VOICE }}
        run: python -m publishers.weekly_news_x.comic_voice
        continue-on-error: true

      # weekly_news_x 전용 Notion 적재 (2026-05-18 재활성)
      # DB: 📰 weekly_news_x — 미국 뉴스 브리핑 발행 이력
      # URL: https://www.notion.so/56130cb86f604b1b9f827f20609d21c5
      # 이력:
      #   2026-05-17: 적재 비활성 (전용 DB 미존재로 404 발생) — env 빈 값으로 임시 차단
      #   2026-05-18: 전용 DB 신규 생성 + Integration 연결 완료 → 재활성
      - name: 📚 Sync draft to Notion
        if: env.DRY_RUN != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          STATUS: Draft
        run: python -m publishers.weekly_news_x.notion_sync
        continue-on-error: true


      - name: 🧪 Preflight direct publish secrets
        id: direct_preflight
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_SCREEN_NAME: ${{ secrets.X_SCREEN_NAME }}
        run: |
          set -euo pipefail
          echo "[preflight] X 실발행 필수 Secret 점검"
          missing=()
          for key in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET X_SCREEN_NAME; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Direct publish 필수 Secret 누락: ${missing[*]}"
            exit 1
          fi
          echo "✅ Direct publish Secret preflight 통과"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # ════════════════════════════════════════════════════════
      # v2.0.0 (2026-05-23): AUTO_PUBLISH_ENABLED 분기 — PR 우회
      # ════════════════════════════════════════════════════════
      # 도입 배경: 2026-05-23 마스터 결정 — PR 생성/머지 실패 시 X 발행 차단되는
      #            문제 해결. collect.py V1~V5 검증 통과 = archive 저장 = 발행 OK.
      #            검증 게이트로 PR/머지를 대체.
      # 안전장치:
      #   - V1~V5 통과한 archive만 존재 → 발행 가능 조건 자동 충족
      #   - publish.py 내부 sidecar 재발행 방지 게이트 그대로
      #   - publish.py 내부 validate_tweets(380자) 그대로
      #   - DRY_RUN=true 시 본 분기 전체 skip
      # ════════════════════════════════════════════════════════
      - name: 🚀 Direct commit archive to main (v2.0.0)
        id: direct_commit
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_PATH_INPUT: ${{ steps.collect.outputs.archive_path }}
          DATE_INPUT: ${{ steps.collect.outputs.date }}
        run: |
          set -euo pipefail
          echo "[direct-commit] archive를 main에 직접 commit 시도"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ARCHIVE_ROOT="$(realpath -- "logs/weekly_news")"
          ARCHIVE_ABS="$(realpath -e -- "${ARCHIVE_PATH_INPUT}")"
          case "${ARCHIVE_ABS}" in
            "${ARCHIVE_ROOT}"/*.md) ;;
            *)
              echo "::error::archive 경로가 logs/weekly_news 하위 .md가 아님: ${ARCHIVE_PATH_INPUT}"
              exit 1
              ;;
          esac

          # logs/는 .gitignore 대상이므로 명시적으로 stage한 뒤 변경을 확인한다.
          # git status <ignored-path>는 신규 파일도 빈 결과를 반환해 발행 후
          # sidecar commit 단계에서 실패하는 잘못된 "변경 없음" 분기를 만든다.
          SIDECAR_PATH="${ARCHIVE_PATH_INPUT}.meta.json"
          git add --force -- "${ARCHIVE_PATH_INPUT}"
          if git diff --cached --quiet -- "${ARCHIVE_PATH_INPUT}"; then
            echo "::warning::archive 변경 없음 — main에 이미 동일 내용 존재 가능"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            if [ -f "${SIDECAR_PATH}" ]; then
              echo "[direct-commit] 기존 sidecar 확인: ${SIDECAR_PATH} — 이미 발행된 archive로 판단"
              echo "publish_ready=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=already_published_sidecar_exists" >> "$GITHUB_OUTPUT"
            else
              echo "[direct-commit] sidecar 없음: ${SIDECAR_PATH} — commit 없이 발행 단계로 복구 진행"
              echo "publish_ready=true" >> "$GITHUB_OUTPUT"
              echo "skip_reason=archive_unchanged_sidecar_missing" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git commit -m "feat(weekly-news): ${DATE_INPUT} auto-publish (V1~V5 PASS)"
          git push origin main
          echo "✅ archive main 직접 commit 완료"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"

      - name: 🐦 Publish thread to X (v2.0.0 direct)
        id: direct_publish
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED == 'true' && steps.direct_commit.outputs.publish_ready == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_SCREEN_NAME: ${{ secrets.X_SCREEN_NAME }}
          ATTACH_IMAGE: ${{ vars.ATTACH_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_REPUBLISH: ${{ vars.FORCE_REPUBLISH }}
          ARCHIVE_PATH: ${{ steps.collect.outputs.archive_path }}
        run: python -m publishers.weekly_news_x.publish

      - name: 💾 Commit sidecar metadata (v2.0.0)
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED == 'true' && steps.direct_publish.outputs.sidecar_path != ''
        env:
          ARCHIVE_PATH_INPUT: ${{ steps.collect.outputs.archive_path }}
          SIDECAR_PATH_INPUT: ${{ steps.direct_publish.outputs.sidecar_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXPECTED_SIDECAR="$(realpath -m -- "${ARCHIVE_PATH_INPUT}.meta.json")"
          SIDECAR_ABS="$(realpath -e -- "${SIDECAR_PATH_INPUT}")"
          if [ "${SIDECAR_ABS}" != "${EXPECTED_SIDECAR}" ]; then
            echo "::error::publish sidecar 경로 불일치: ${SIDECAR_PATH_INPUT}"
            exit 1
          fi
          # publish 결과는 ignore된 logs/ 아래에 있으므로 해당 파일만 강제 stage한다.
          git add --force -- "${SIDECAR_PATH_INPUT}"
          if ! git diff --staged --quiet; then
            git commit -m "chore(weekly-news): publish metadata $(date -u +%Y-%m-%d)"
            git push origin main
            echo "✅ sidecar committed: ${SIDECAR_PATH_INPUT}"
          else
            echo "ℹ️ no sidecar changes to commit"
          fi

      - name: 📚 Sync published thread to Notion (v2.0.0)
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED == 'true' && steps.direct_publish.outputs.thread_url != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          THREAD_URL: ${{ steps.direct_publish.outputs.thread_url }}
          STATUS: Published
        run: python -m publishers.weekly_news_x.notion_sync
        continue-on-error: true

      # ════════════════════════════════════════════════════════
      # 기존 PR 흐름 (백업 경로, AUTO_PUBLISH_ENABLED=false 시만)
      # ════════════════════════════════════════════════════════
      # PR 생성 — DRY_RUN=false 일 때만
      - name: 📤 Create Pull Request
        id: pr
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'draft(weekly-news): ${{ steps.collect.outputs.date }}'
          title: '[Weekly-News Draft] ${{ steps.collect.outputs.date }}'
          body: |
            ## 자동 생성 — Weekly News 초안

            - 파일: `${{ steps.collect.outputs.archive_path }}`
            - 검수 후 **Merge** 시 자동 X 발행 (`weekly_news_publish.yml` 트리거)
            - 수정 필요 시: 본 PR 브랜치에 직접 커밋
            - 폐기: PR Close (X 발행 없음)

            ---

            ⚠️ Merge 전 본문 팩트체크 수행 바람.
          branch: weekly-news/${{ steps.collect.outputs.date }}
          delete-branch: true
          labels: weekly-news-draft

      # v1.4.0 신규 (2026-05-18): Auto-merge — validation 통과 시 PR 자동 머지
      # v2.1.0: AUTO_MERGE_DRAFT_PR=true일 때만 실행되는 백업 경로로 격하
      - name: 🟢 Auto-merge PR (v1.4.0)
        if: env.DRY_RUN != 'true' && env.AUTO_PUBLISH_ENABLED != 'true' && env.AUTO_MERGE_DRAFT_PR == 'true' && steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.pull-request-number }}"
          echo "[auto-merge] PR #${PR_NUM} 즉시 머지 시도 (--squash --delete-branch)"
          gh pr merge "${PR_NUM}" --squash --delete-branch --admin || {
            echo "::warning::auto-merge 실패 — 마스터가 수동 머지 가능"
            exit 0
          }
          echo "✅ Auto-merge 완료 — publish.yml 자동 트리거됨"

      # D3 패치 (2026-05-17): always() + PR step outcome 4분기 처리
      # 도입 배경: 기존 if: success() 는 PR step 실패 시 알림도 차단 → 인지 지연.
      # 분기:
      #   - outcome=skipped (DRY_RUN) → notify_draft_created(dry_run=True)
      #   - outcome=failure          → notify_draft_failure(stage='pr_creation')
      #   - outcome=success & pr_url 있음 → notify_draft_created(dry_run=False)
      #   - outcome=success & pr_url 비어있음 → notify_draft_failure(stage='pr_creation',
      #                                          error='PR outputs empty')
      - name: 📨 Notify draft (Telegram INTERNAL)
        if: always() && steps.collect.outputs.archive_path != ''
        env:
          DRY_RUN_INPUT: ${{ env.DRY_RUN }}
          AUTO_PUBLISH_INPUT: ${{ env.AUTO_PUBLISH_ENABLED }}
          DIRECT_PREFLIGHT_OUTCOME: ${{ steps.direct_preflight.outcome }}
          ARCHIVE_PATH_INPUT: ${{ steps.collect.outputs.archive_path }}
          PR_URL_INPUT: ${{ steps.pr.outputs.pull-request-url }}
          PR_STEP_OUTCOME: ${{ steps.pr.outcome }}
          DIRECT_COMMITTED: ${{ steps.direct_commit.outputs.committed }}
          DIRECT_PUBLISH_READY: ${{ steps.direct_commit.outputs.publish_ready }}
          DIRECT_SKIP_REASON: ${{ steps.direct_commit.outputs.skip_reason }}
          DIRECT_PUBLISH_OUTCOME: ${{ steps.direct_publish.outcome }}
          DIRECT_THREAD_URL: ${{ steps.direct_publish.outputs.thread_url }}
          WEEKDAY_INPUT: ${{ steps.collect.outputs.weekday }}
        run: |
          python -c "
          import os
          dry_run = (os.environ.get('DRY_RUN_INPUT', 'false').lower() == 'true')
          auto_publish = (os.environ.get('AUTO_PUBLISH_INPUT', 'false').lower() == 'true')
          archive_path = os.environ.get('ARCHIVE_PATH_INPUT', '')
          weekday = os.environ.get('WEEKDAY_INPUT', 'Saturday') or 'Saturday'

          # v2.0.0 (AUTO_PUBLISH_ENABLED=true) 분기
          if auto_publish and not dry_run:
              preflight_outcome = os.environ.get('DIRECT_PREFLIGHT_OUTCOME', '')
              direct_committed = os.environ.get('DIRECT_COMMITTED', '') == 'true'
              publish_ready = os.environ.get('DIRECT_PUBLISH_READY', '') == 'true'
              skip_reason = os.environ.get('DIRECT_SKIP_REASON', '')
              direct_outcome = os.environ.get('DIRECT_PUBLISH_OUTCOME', '')
              thread_url = os.environ.get('DIRECT_THREAD_URL', '')

              if preflight_outcome == 'failure':
                  from publishers.weekly_news_x.notifier import notify_draft_failure
                  notify_draft_failure(
                      stage='direct_preflight',
                      error_msg='X 실발행 필수 Secret 누락으로 archive commit 전 발행 차단. Actions preflight 로그 확인 필요.',
                      weekday=weekday,
                  )
              elif not direct_committed and not publish_ready:
                  if skip_reason == 'already_published_sidecar_exists':
                      from publishers.weekly_news_x.notifier import notify_draft_created
                      notify_draft_created(
                          archive_path=archive_path,
                          pr_url='(skip: archive와 sidecar가 이미 존재하여 중복 발행 방지)',
                          weekday=weekday,
                          dry_run=True,
                      )
                  else:
                      from publishers.weekly_news_x.notifier import notify_draft_failure
                      notify_draft_failure(
                          stage='direct_commit_skipped',
                          error_msg=f'archive 변경 없음 및 publish_ready=false (reason={skip_reason}). 발행 차단.',
                          weekday=weekday,
                      )
              elif direct_outcome == 'failure':
                  from publishers.weekly_news_x.notifier import notify_draft_failure
                  notify_draft_failure(
                      stage='direct_publish',
                      error_msg='archive commit은 성공했으나 X 발행 실패. publish.py 로그 확인 필요.',
                      weekday=weekday,
                  )
              elif direct_outcome == 'success':
                  from publishers.weekly_news_x.notifier import notify_success
                  notify_success(
                      archive_name=archive_path.split('/')[-1] if archive_path else 'unknown',
                      thread_url=thread_url or '(unknown)',
                      tweet_count=0,
                  )
              else:
                  from publishers.weekly_news_x.notifier import notify_draft_failure
                  notify_draft_failure(
                      stage='direct_publish_skipped',
                      error_msg=f'direct_publish outcome={direct_outcome}',
                      weekday=weekday,
                  )
              raise SystemExit(0)

          # 기존 PR 흐름 (AUTO_PUBLISH_ENABLED=false)
          pr_outcome = os.environ.get('PR_STEP_OUTCOME', 'success')
          pr_url = os.environ.get('PR_URL_INPUT', '')

          if pr_outcome == 'failure':
              from publishers.weekly_news_x.notifier import notify_draft_failure
              notify_draft_failure(
                  stage='pr_creation',
                  error_msg='collect는 성공했으나 PR 생성 실패. Actions 권한 또는 peter-evans 설정 확인 필요.',
                  weekday=weekday,
              )
          elif pr_outcome == 'success' and not pr_url and not dry_run:
              from publishers.weekly_news_x.notifier import notify_draft_failure
              notify_draft_failure(
                  stage='pr_creation',
                  error_msg='PR step success인데 outputs empty — 변경사항 없음 또는 권한 누락 가능.',
                  weekday=weekday,
              )
          else:
              # success+pr_url 보유 OR skipped(DRY_RUN)
              from publishers.weekly_news_x.notifier import notify_draft_created
              notify_draft_created(
                  archive_path=archive_path,
                  pr_url=pr_url,
                  weekday=weekday,
                  dry_run=dry_run,
              )
          "
        continue-on-error: true

      - name: 📦 Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-news-draft-${{ github.run_number }}
          path: logs/weekly_news/
          retention-days: 14
