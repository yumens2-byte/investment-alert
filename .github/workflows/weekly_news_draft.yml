name: Weekly News Draft

# 기존 alert-pipeline 과 별개 group → 동시 실행 가능
concurrency:
  group: weekly-news-draft
  cancel-in-progress: false

"on":
  schedule:
    # KST 토요일 09:00 = UTC 토요일 00:00
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN 모드 (true=PR 미생성/검증만, false=정상)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Collect & Open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Telegram 알림용 (alert.yml 시크릿 재활용)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}
      # cron 실행 시 DRY_RUN=false, workflow_dispatch 시 사용자 입력
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect news (Claude API + web_search)
        id: collect
        run: python -m publishers.weekly_news_x.collect

      # 옵션: APPEND_COMIC_VOICE Variable 등록 시에만 실제 동작
      - name: Append comic character voice (optional)
        env:
          APPEND_COMIC_VOICE: ${{ vars.APPEND_COMIC_VOICE }}
        run: python -m publishers.weekly_news_x.comic_voice
        continue-on-error: true

      # 옵션: NOTION_TOKEN/DB_ID 시크릿 등록 시에만 실제 동작
      # DRY_RUN=true 시 Notion에도 적재하지 않음 (검증 모드 일관성)
      - name: Sync draft to Notion (optional)
        if: env.DRY_RUN != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          STATUS: Draft
        run: python -m publishers.weekly_news_x.notion_sync
        continue-on-error: true

      # PR 생성 — DRY_RUN=false 일 때만
      - name: Create Pull Request
        id: pr
        if: env.DRY_RUN != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'draft(weekly-news): ${{ steps.collect.outputs.date }}'
          title: '[Weekly-News Draft] ${{ steps.collect.outputs.date }}'
          body: |
            ## 자동 생성 — Weekly News 초안

            - 파일: `${{ steps.collect.outputs.archive_path }}`
            - 검수 후 **Merge** 시 자동 X 발행 (`weekly_news_publish.yml` 트리거)
            - 수정 필요 시: 본 PR 브랜치에 직접 커밋
            - 폐기: PR Close (X 발행 없음)

            ---

            ⚠️ Merge 전 본문 팩트체크 수행 바람.
          branch: weekly-news/${{ steps.collect.outputs.date }}
          delete-branch: true
          labels: weekly-news-draft

      # Telegram 알림 — draft 생성 성공
      - name: Notify draft created (Telegram INTERNAL)
        if: success() && steps.collect.outputs.archive_path != ''
        env:
          DRY_RUN_INPUT: ${{ env.DRY_RUN }}
          ARCHIVE_PATH_INPUT: ${{ steps.collect.outputs.archive_path }}
          PR_URL_INPUT: ${{ steps.pr.outputs.pull-request-url }}
          WEEKDAY_INPUT: ${{ steps.collect.outputs.weekday }}
        run: |
          python -c "
          import os
          from publishers.weekly_news_x.notifier import notify_draft_created
          notify_draft_created(
              archive_path=os.environ.get('ARCHIVE_PATH_INPUT', ''),
              pr_url=os.environ.get('PR_URL_INPUT', ''),
              weekday=os.environ.get('WEEKDAY_INPUT', 'Saturday') or 'Saturday',
              dry_run=(os.environ.get('DRY_RUN_INPUT', 'false').lower() == 'true'),
          )
          "
        continue-on-error: true

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-news-draft-${{ github.run_number }}
          path: logs/weekly_news/
          retention-days: 14
