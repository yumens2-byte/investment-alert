name: Weekly News Publish

# 기존 alert-pipeline 과 별개 group
concurrency:
  group: weekly-news-publish
  cancel-in-progress: false

"on":
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      archive_path:
        description: '발행할 archive 경로 (예: logs/weekly_news/2026/06/2026-06-06-saturday.md)'
        type: string
        required: true
      force_republish:
        description: 'sidecar가 있어도 강제 재발행'
        type: boolean
        default: false

permissions:
  # sidecar 자동 commit 위해 contents: write 필요
  contents: write

jobs:
  publish:
    name: Publish Thread to X
    # PR merge 이벤트 또는 수동 workflow_dispatch일 때 실행
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'weekly-news-draft'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_SCREEN_NAME: ${{ secrets.X_SCREEN_NAME }}
      # Telegram 알림용 (기존 alert.yml과 동일 시크릿 재활용)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}
      DRY_RUN: 'false'

    steps:
      - name: 🔄 Checkout main (merged)
        uses: actions/checkout@v4
        with:
          ref: main
          # commit & push 위해 토큰과 fetch-depth 명시
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 옵션: ATTACH_IMAGE Variable 사용 시 openai 설치
      - name: 🎨 Install optional image deps
        if: ${{ vars.ATTACH_IMAGE == 'true' }}
        run: pip install openai

      # D2 패치 (2026-05-17): git diff 기반 archive 명시 추출
      # v2.1.0: workflow_dispatch 수동 운영 테스트/재발행 경로 추가
      - name: 🔍 Resolve archive path
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_PATH_INPUT: ${{ github.event.inputs.archive_path }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PICKED="$ARCHIVE_PATH_INPUT"
            if [ -z "$PICKED" ]; then
              echo "❌ archive_path input 누락"
              exit 1
            fi
            case "$PICKED" in
              logs/weekly_news/*.md) ;;
              *)
                echo "❌ archive_path는 logs/weekly_news/ 하위 .md 파일이어야 함: $PICKED"
                exit 1
                ;;
            esac
            if [ ! -f "$PICKED" ]; then
              echo "❌ archive 파일 없음: $PICKED"
              exit 1
            fi
          else
            # PR merge 경로: PR이 추가/수정한 .md만 정확히 선택.
            CHANGED_MD_LIST=$(git diff --name-only HEAD~1 HEAD \
              | grep '^logs/weekly_news/.*\.md$' \
              | grep -v '\.meta\.json$' || true)
            CHANGED_COUNT=$(printf '%s\n' "$CHANGED_MD_LIST" | grep -c . || true)
            echo "변경된 archive .md 수: ${CHANGED_COUNT}"
            if [ "$CHANGED_COUNT" -eq 0 ]; then
              echo "❌ PR에 archive .md 변경 없음 — 발행 불가"
              exit 1
            elif [ "$CHANGED_COUNT" -gt 1 ]; then
              echo "⚠️ PR에 archive .md ${CHANGED_COUNT}개 변경 — mtime 최신 1개만 사용"
              PICKED=$(printf '%s\n' "$CHANGED_MD_LIST" \
                | xargs -I{} stat -c '%Y %n' "{}" \
                | sort -rn | head -1 | awk '{print $2}')
            else
              PICKED="$CHANGED_MD_LIST"
            fi
          fi

          # case 패턴만으로는 ../ 경로 순회를 차단할 수 없으므로 canonical path를 검사한다.
          ARCHIVE_ROOT="$(realpath -- "logs/weekly_news")"
          PICKED_ABS="$(realpath -e -- "${PICKED}")"
          case "${PICKED_ABS}" in
            "${ARCHIVE_ROOT}"/*.md) ;;
            *)
              echo "❌ archive 경로가 logs/weekly_news 하위 .md가 아님: $PICKED"
              exit 1
              ;;
          esac

          echo "✅ Selected: $PICKED"
          echo "archive_path=$PICKED" >> "$GITHUB_OUTPUT"
      - name: 🐦 Publish thread to X
        id: publish
        env:
          ATTACH_IMAGE: ${{ vars.ATTACH_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_REPUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_republish || vars.FORCE_REPUBLISH }}
          ARCHIVE_PATH: ${{ steps.detect.outputs.archive_path }}
        run: python -m publishers.weekly_news_x.publish

      # sidecar 메타데이터 git commit & push (재발행 방지 영속화)
      - name: 💾 Commit sidecar metadata
        if: ${{ steps.publish.outputs.sidecar_path != '' }}
        env:
          ARCHIVE_PATH_INPUT: ${{ steps.detect.outputs.archive_path }}
          SIDECAR_PATH_INPUT: ${{ steps.publish.outputs.sidecar_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXPECTED_SIDECAR="$(realpath -m -- "${ARCHIVE_PATH_INPUT}.meta.json")"
          SIDECAR_ABS="$(realpath -e -- "${SIDECAR_PATH_INPUT}")"
          if [ "${SIDECAR_ABS}" != "${EXPECTED_SIDECAR}" ]; then
            echo "::error::publish sidecar 경로 불일치: ${SIDECAR_PATH_INPUT}"
            exit 1
          fi
          # sidecar는 ignore된 logs/ 아래에 있으므로 해당 파일만 강제 stage한다.
          git add --force -- "${SIDECAR_PATH_INPUT}"
          if ! git diff --staged --quiet; then
            git commit -m "chore(weekly-news): publish metadata $(date -u +%Y-%m-%d)"
            git push origin main
            echo "✅ sidecar committed: ${SIDECAR_PATH_INPUT}"
          else
            echo "ℹ️ no sidecar changes to commit"
          fi

      # weekly_news_x 전용 Notion 적재 (2026-05-18 재활성)
      # DB: 📰 weekly_news_x — 미국 뉴스 브리핑 발행 이력
      # URL: https://www.notion.so/56130cb86f604b1b9f827f20609d21c5
      # 이력:
      #   2026-05-17: 적재 비활성 (전용 DB 미존재로 404 발생) — env 빈 값으로 임시 차단
      #   2026-05-18: 전용 DB 신규 생성 + Integration 연결 완료 → 재활성
      - name: 📚 Sync published thread to Notion
        if: ${{ steps.publish.outputs.thread_url != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          THREAD_URL: ${{ steps.publish.outputs.thread_url }}
          STATUS: Published
        run: python -m publishers.weekly_news_x.notion_sync
        continue-on-error: true

      - name: 📊 Summary
        if: always()
        run: |
          echo "### Weekly News Publish 결과" >> $GITHUB_STEP_SUMMARY
          echo "- Thread URL: ${{ steps.publish.outputs.thread_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tweet count: ${{ steps.publish.outputs.tweet_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sidecar: ${{ steps.publish.outputs.sidecar_path }}" >> $GITHUB_STEP_SUMMARY
