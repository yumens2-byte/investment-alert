name: Weekly News Publish

# 기존 alert-pipeline 과 별개 group
concurrency:
  group: weekly-news-publish
  cancel-in-progress: false

"on":
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  # sidecar 자동 commit 위해 contents: write 필요
  contents: write

jobs:
  publish:
    name: Publish Thread to X
    # PR이 'merged' && 'weekly-news-draft' 라벨 보유일 때만 실행
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'weekly-news-draft')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_SCREEN_NAME: ${{ secrets.X_SCREEN_NAME }}
      # Telegram 알림용 (기존 alert.yml과 동일 시크릿 재활용)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}
      DRY_RUN: 'false'

    steps:
      - name: 🔄 Checkout main (merged)
        uses: actions/checkout@v4
        with:
          ref: main
          # commit & push 위해 토큰과 fetch-depth 명시
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 옵션: ATTACH_IMAGE Variable 사용 시 openai 설치
      - name: 🎨 Install optional image deps
        if: ${{ vars.ATTACH_IMAGE == 'true' }}
        run: pip install openai

      # D2 패치 (2026-05-17): git diff 기반 archive 명시 추출
      # 도입 배경: 기존 find_latest_archive()는 mtime 의존 — checkout으로 mtime 통일 시
      #            토/일 archive 충돌 가능. PR이 추가/수정한 .md만 정확히 선택.
      # 정책: 1 PR = 1 archive 권장이나 ≥2개도 mtime 최신 사용 (운영가이드 Q2 호환)
      - name: 🔍 Detect archive path from PR diff
        id: detect
        run: |
          set -euo pipefail
          CHANGED_MD_LIST=$(git diff --name-only HEAD~1 HEAD \
            | grep '^logs/weekly_news/.*\.md$' \
            | grep -v '\.meta\.json$' || true)
          CHANGED_COUNT=$(printf '%s\n' "$CHANGED_MD_LIST" | grep -c . || true)
          echo "변경된 archive .md 수: ${CHANGED_COUNT}"
          if [ "$CHANGED_COUNT" -eq 0 ]; then
            echo "❌ PR에 archive .md 변경 없음 — 발행 불가"
            exit 1
          elif [ "$CHANGED_COUNT" -gt 1 ]; then
            echo "⚠️ PR에 archive .md ${CHANGED_COUNT}개 변경 — mtime 최신 1개만 사용"
            PICKED=$(printf '%s\n' "$CHANGED_MD_LIST" \
              | xargs -I{} stat -c '%Y %n' "{}" \
              | sort -rn | head -1 | awk '{print $2}')
          else
            PICKED="$CHANGED_MD_LIST"
          fi
          echo "✅ Selected: $PICKED"
          echo "archive_path=$PICKED" >> "$GITHUB_OUTPUT"

      - name: 🐦 Publish thread to X
        id: publish
        env:
          ATTACH_IMAGE: ${{ vars.ATTACH_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_REPUBLISH: ${{ vars.FORCE_REPUBLISH }}
          ARCHIVE_PATH: ${{ steps.detect.outputs.archive_path }}
        run: python -m publishers.weekly_news_x.publish

      # sidecar 메타데이터 git commit & push (재발행 방지 영속화)
      - name: 💾 Commit sidecar metadata
        if: ${{ steps.publish.outputs.sidecar_path != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.publish.outputs.sidecar_path }}"
          if ! git diff --staged --quiet; then
            git commit -m "chore(weekly-news): publish metadata $(date -u +%Y-%m-%d)"
            git push origin main
            echo "✅ sidecar committed: ${{ steps.publish.outputs.sidecar_path }}"
          else
            echo "ℹ️ no sidecar changes to commit"
          fi

      # 옵션: Notion에 Published 상태로 적재
      - name: 📚 Sync published thread to Notion (optional)
        if: ${{ steps.publish.outputs.thread_url != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          THREAD_URL: ${{ steps.publish.outputs.thread_url }}
          STATUS: Published
        run: python -m publishers.weekly_news_x.notion_sync
        continue-on-error: true

      - name: 📊 Summary
        if: always()
        run: |
          echo "### Weekly News Publish 결과" >> $GITHUB_STEP_SUMMARY
          echo "- Thread URL: ${{ steps.publish.outputs.thread_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tweet count: ${{ steps.publish.outputs.tweet_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sidecar: ${{ steps.publish.outputs.sidecar_path }}" >> $GITHUB_STEP_SUMMARY
