name: Alert Pipeline

# C1 패치 (v1.1.0): cron + workflow_dispatch 동시 실행 차단
concurrency:
  group: alert-pipeline
  cancel-in-progress: false

"on":
  schedule:
    # P1 (v1.4.0): UTC 기준. EDT(UTC-4)/EST(UTC-5) 모두에서 ET 09:30/10:30/15:30 창마다 2회(:21, :33) 판정
    - cron: '21,33 13-15,19-20 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN 모드 (true=모의, false=실발행)'
        type: boolean
        default: false
      source:
        description: '실행 주체 (manual=수동 즉시 실행, scheduler=외부 스케줄러: gate·지연 적용)'
        type: choice
        options: [manual, scheduler]
        default: manual

# P1: 창 정의를 gate / run_alert 양쪽에 동일하게 명시 전달 (D2)
env:
  ALERT_WINDOWS: '09:30,10:30,15:30'
  ALERT_GRACE_MINUTES: '12'
  ALERT_TZ: 'America/New_York'

jobs:
  gate:
    name: Alert Window Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      inside: ${{ steps.decide.outputs.inside }}
      target: ${{ steps.decide.outputs.target }}
      et_date: ${{ steps.decide.outputs.et_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib only — pip install 없음. margin = delay 상한(120s) + 후속 준비(90s)
      - name: Decide window
        id: decide
        run: python -m core.alert_window --margin-sec 210

      - name: Gate summary
        run: |
          echo "event=${{ github.event_name }} inside=${{ steps.decide.outputs.inside }} target=${{ steps.decide.outputs.target }} et_date=${{ steps.decide.outputs.et_date }}" >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: Alert Detection & Publish
    needs: gate
    # 수동 workflow_dispatch(source=manual) 는 gate 결과 무시. schedule 과 외부 스케줄러(source=scheduler) 는 inside=='true' 일 때만
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.source != 'scheduler') || needs.gate.outputs.inside == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10                          # ← 추가 (점검 #3)

    env:
      DQ_FRESH_WINDOW_SECONDS : ${{ secrets.DQ_FRESH_WINDOW_SECONDS }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      POLICY_VERSION: 'v1.1.0'   # C3 패치 (v1.1.0): 정책 버전 명시 적재
      TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }}   # manual|scheduler|schedule
      DETECTION_POLICY: ${{ vars.DETECTION_POLICY }}   # Q2: v1|v2 (미설정=v1, 비활성 정책은 shadow 기록)
      YOUTUBE_CHANNELS: ${{ secrets.YOUTUBE_CHANNELS }}
      YOUTUBE_API_KEY : ${{ secrets.YOUTUBE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
      GEMINI_API_KEY : ${{ secrets.GEMINI_API_KEY }}
      SECTOR_KIND_TONE_ENABLED: ${{ vars.SECTOR_KIND_TONE_ENABLED }}
      # ▼ 추가
      KIND_TONE_ENABLED: ${{ vars.KIND_TONE_ENABLED }}
      KIND_TONE_IMAGE_ENABLED: ${{ vars.KIND_TONE_IMAGE_ENABLED }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # P3: DuplicateGuard 관찰 모드 (repo var 미설정 시 코드 기본 true)
      DUP_OBSERVE_ONLY: ${{ vars.DUP_OBSERVE_ONLY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # P1 (v1.4.0): gate 통과 후 0~120초 random delay (X 안티봇). 창 마감 여유는 gate margin 210s 로 확보
      # 수동 workflow_dispatch 는 즉시 실행 (디버깅 편의). 외부 스케줄러(source=scheduler)는 schedule 과 동일하게 지연
      - name: Anti-bot random delay (schedule / scheduler)
        if: github.event_name == 'schedule' || inputs.source == 'scheduler'
        run: |
          DELAY=$((RANDOM % 121))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create log directory
        run: mkdir -p logs

      - name: Run Alert Pipeline
        id: alert
        shell: bash
        run: |
          set -o pipefail
          python run_alert.py 2>&1 | tee logs/alert.log

      # P4/m3: 진단은 발행 이후로 이동 (발행 지연 방지). 발행 실패(exit 1)여도 실행, 진단 실패는 무시
      - name: Run Diagnostics
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.inside == 'true') }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          python run_diagnostics.py 2>&1 | tee logs/diagnostics.log

      # P4: 실패 또는 gate 통과(dispatch 포함) 실행만 업로드
      - name: Upload log artifact
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' || needs.gate.outputs.inside == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: alert-log-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
