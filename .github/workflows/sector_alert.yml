name: Sector Flow Alert

# 동일 패턴 — cron + workflow_dispatch 동시 실행 차단
concurrency:
  group: sector-alert-pipeline
  cancel-in-progress: false

"on":
  schedule:
    # 1차 시도: US 마감 후 2시간 대기 — Yahoo 종가 확정 충분히 확보
    # KST 08:00 = UTC 23:00 = ET 18:00(EDT) / 17:00(EST) 평일
    - cron: '0 23 * * 1-5'
    # 2차 시도 (v1.2.0): 1차 실패 시 1시간 뒤 자동 재실행
    # UNIQUE 멱등성으로 1차 성공해도 안전 (조건부 INSERT)
    # 평일 cron 1-5 + 1시간 뒤 = days 2-6 (화~토)
    # 토요일 UTC 00:00 = KST 토 09:00 = ET 금 19:00 (시장 마감 후) — 정상 처리
    - cron: '0 0 * * 2-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN 모드 (true=모의, false=실발행)'
        type: boolean
        default: true

jobs:
  sector_alert:
    name: Sector Flow Detection & Publish
    runs-on: ubuntu-latest
    # v1.2.1: 10 → 15분 — anti-bot 최대 400초 + Yahoo 최악 60초 + retry 13초×2 + TG 90초 여유 확보
    timeout-minutes: 15

    env:
      # 운영 제어 — 기존 alert.yml과 동일 패턴
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      POLICY_VERSION: 'sector-v1.0.0'

      # Sector 전용 환경변수
      SECTOR_SHADOW_MODE: 'true'                # Phase 1: 2주간 TG Internal only
      SECTOR_ROTATION_THR_1D: '1.0'             # 1일 spread 임계 (%p)
      SECTOR_ROTATION_THR_5D: '1.5'             # 5일 spread 임계 (%p)

      # Supabase (기존 secrets 재사용)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # Telegram (기존 secrets 재사용)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
      TELEGRAM_INTERNAL_CHANNEL_ID: ${{ secrets.TELEGRAM_INTERNAL_CHANNEL_ID }}

      # X (Phase 2 정식 전환 후 사용 — 현재 미활용)
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      SECTOR_KIND_TONE_ENABLED: ${{ vars.SECTOR_KIND_TONE_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 안티봇: schedule 진입 시 0~400초 random delay (기존 alert.yml 패턴)
      - name: Anti-bot random delay (schedule only)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 400))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY

      - name: Create log directory
        run: mkdir -p logs

      - name: Run Sector Alert Pipeline
        run: python run_sector_alert.py

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-alert-log-${{ github.run_number }}
          path: logs/
          retention-days: 14
