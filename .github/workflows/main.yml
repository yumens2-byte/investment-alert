name: Investment OS Auto Publish

on:
  schedule:
    - cron: "30 21 * * 0-4"
    # - cron: "30 14 * * 1-5"
    # - cron: "30 20 * * 1-5"
    - cron: "0 11 * * 4"
    # - cron: "*/10 13-21 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "30 2 * * 1-5" 
    # alert 전용: 미국장 시간대를 UTC로 넓게 커버
    - cron: '*/10 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: session
        required: true
        default: morning
        type: choice
        options:
          - morning
          #- intraday
          #- close
          - alert
          - full
          #- weekly
          - narrative
      mode:
        description: "mode (alert, full 선택 시 무시됨)"
        required: true
        default: tweet
        type: choice
        options:
          - tweet
          - thread
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
  DRY_RUN: ${{ secrets.DRY_RUN }}
  FORCE_RUN: ${{ secrets.FORCE_RUN || 'false' }}
  LOG_LEVEL: INFO
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
  TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
  GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
  GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  YOUTUBE_CHANNELS: ${{ secrets.YOUTUBE_CHANNELS }}
  MULTILINGUAL_ENABLED: ${{ secrets.MULTILINGUAL_ENABLED }}
  LUNAR_CRUSH_API_KEY: ${{ secrets.LUNAR_CRUSH_API_KEY }}

jobs:

  pilot_test:
    name: Pilot Test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - run: pip install -r requirements.txt

      # pilot_test는 외부 API 없이 픽스처로 동작 — Playwright/fonts 불필요
      - run: python main.py test --round all
        env:
          DRY_RUN: "true"
          LOG_LEVEL: WARNING

  morning:
    name: Morning Brief
    if: github.event.schedule == '30 21 * * 0-4' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
      GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      YOUTUBE_CHANNELS: ${{ secrets.YOUTUBE_CHANNELS }}
      MULTILINGUAL_ENABLED: ${{ secrets.MULTILINGUAL_ENABLED }}
      LUNAR_CRUSH_API_KEY: ${{ secrets.LUNAR_CRUSH_API_KEY }}
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          
      - run: pip install -r requirements.txt
      # 변경
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-fonts-nanum-v1

      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum
          
      - run: playwright install chromium --with-deps
      - name: Restore weekly log cache
        uses: actions/cache@v4
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}
          restore-keys: weekly-log-

        #수정   
      - name: Restore rank history cache
        uses: actions/cache@v4
        with:
          path: data/published/rank_history.json
          key: rank-history-${{ github.ref }}
          restore-keys: rank-history-
      - name: Anti-bot random delay
        run: |
          DELAY=$((RANDOM % 100))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY    
      - run: python main.py run all --session morning --mode tweet
      #== 26.04.12 추가==
      - name: Save core_data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/outputs/core_data.json
          key: core-data-${{ github.ref }}-${{ github.run_id }}
          
      - name: Save rank history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/rank_history.json
          key: rank-history-${{ github.ref }}-${{ github.run_id }}
      - name: Save weekly log cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-${{ github.run_id }}
          path: |
            data/outputs/core_data.json
            data/outputs/validation_result.json
          retention-days: 7

      - name: Restore DLQ cache
        uses: actions/cache@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}
          restore-keys: dlq-

      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}

  intraday:
    name: Intraday Update
    if: github.event.schedule == '30 14 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'intraday')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
      GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore weekly log cache
        uses: actions/cache@v4
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}
          restore-keys: weekly-log-
      - run: playwright install chromium --with-deps
      - name: Anti-bot random delay
        run: |
          DELAY=$((RANDOM % 100))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY
      - run: python main.py run all --session intraday --mode tweet
      - name: Restore rank history cache
        uses: actions/cache@v4
        with:
          path: data/published/rank_history.json
          key: rank-history-${{ github.ref }}
          restore-keys: rank-history-
      - name: Save weekly log cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-${{ github.run_id }}
          path: data/outputs/core_data.json
          retention-days: 3

      - name: Restore DLQ cache
        uses: actions/cache@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}
          restore-keys: dlq-

      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}

  close:
    name: Close Summary
    if: github.event.schedule == '30 20 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'close')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
      GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: playwright install chromium --with-deps
      - run: pip install -r requirements.txt
      - name: Restore weekly log cache
        uses: actions/cache@v4
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}
          restore-keys: weekly-log-
      - name: Anti-bot random delay
        run: |
          DELAY=$((RANDOM % 100))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY    
      - run: python main.py run all --session close --mode ${{ github.event.inputs.mode || 'tweet' }}
      - name: Restore rank history cache
        uses: actions/cache@v4
        with:
          path: data/published/rank_history.json
          key: rank-history-${{ github.ref }}
          restore-keys: rank-history-
      - name: Save weekly log cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: close-${{ github.run_id }}
          path: data/outputs/core_data.json
          retention-days: 3

      - name: Restore DLQ cache
        uses: actions/cache@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}
          restore-keys: dlq-

      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}

  weekly_thread:
    name: Weekly Thread
    if: github.event.schedule == '0 11 * * 4' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
      GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore weekly log cache
        uses: actions/cache@v4
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}
          restore-keys: weekly-log-
      - name: Anti-bot random delay
        run: |
          DELAY=$((RANDOM % 100))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY    
      - run: python main.py run all --session weekly --mode thread
      - name: Restore rank history cache
        uses: actions/cache@v4
        with:
          path: data/published/rank_history.json
          key: rank-history-${{ github.ref }}
          restore-keys: rank-history-
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-${{ github.run_id }}
          path: data/outputs/
          retention-days: 14

      - name: Restore DLQ cache
        uses: actions/cache@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}
          restore-keys: dlq-

      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}

  alert_check:
    name: Alert Check
    if: |
       github.event.schedule == '*/10 13-21 * * 1-5' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'alert')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: alert-check-${{ github.ref }}
      cancel-in-progress: false
    env:
      ALERT_TZ: America/New_York
      ALERT_WINDOWS: "09:30,10:30,11:30,12:30,14:30,15:30"
      ALERT_GRACE_MINUTES: "20"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
      GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Alert 발생시간 램덤 하게 동작하기 위함
      # - name: Anti-bot random delay
      #   run: |
      #     DELAY=$((RANDOM % 100))
      #     echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
      #     sleep $DELAY    

      # Alert 이력 캐시 복원 (등급 변화 감지 핵심)
      # FIX CACHE-FREEZE (2026-08-12): actions/cache@v4 full action은 primary key miss 시
      #   job 종료 post-save로 고정 키 캐시를 생성 → 이후 정확 매치가 restore-keys보다
      #   우선하여 해당 시점 데이터로 영구 동결됨 (core_data 2026-04-12 동결 사고).
      #   cache/restore(post-save 없음) + run_id 포함 primary key(항상 miss)로
      #   restore-keys가 prefix 매치 중 최신 캐시를 선택하도록 변경.
      - name: Restore alert history cache
        uses: actions/cache/restore@v4
        with:
          path: data/published/alert_history.json
          key: alert-history-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            alert-history-${{ github.ref }}-
            alert-history-

      # FIX CACHE-FREEZE (2026-08-12): 동결 방지 — 상단 alert history 주석 참조
      - name: Restore core_data cache
        uses: actions/cache/restore@v4
        with:
          path: data/outputs/core_data.json
          key: core-data-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            core-data-${{ github.ref }}-
            core-data-

      # x_alert_history: Step X 감정 트리거 X 발행 쿨다운 이력 (90분 중복 방지)
      # 반드시 python main.py alert 실행 전에 복원해야 run_alert.py가 이력을 읽을 수 있다.
      # FIX CACHE-FREEZE (2026-08-12): 동결 방지.
      #   주의: save 키는 x-alert-history-${{ github.run_id }} (ref 미포함, 기존 사양 유지)
      #   → restore-keys는 전역 prefix 'x-alert-history-' 단독이어야 실저장분과 매치됨.
      - name: Restore x_alert_history cache
        uses: actions/cache/restore@v4
        with:
          path: x_alert_history.json
          key: x-alert-history-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            x-alert-history-

      - run: pip install -r requirements.txt
      - run: python main.py alert

      # Alert 이력 캐시 저장 (다음 실행 시 복원)
      - name: Save alert history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/alert_history.json
          key: alert-history-${{ github.ref }}-${{ github.run_id }}

      - name: Save x_alert_history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: x_alert_history.json
          key: x-alert-history-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alert-${{ github.run_id }}
          path: data/published/alert_history.json
          retention-days: 7

      # FIX CACHE-FREEZE (2026-08-12): 동결 방지 — 상단 alert history 주석 참조
      - name: Restore DLQ cache
        uses: actions/cache/restore@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            dlq-${{ github.ref }}-
            dlq-

      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}

  full_dashboard:
    name: Full Dashboard
    if: github.event.schedule == '30 9 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
      GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: Restore weekly log cache
        uses: actions/cache@v4
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}
          restore-keys: weekly-log-
      - name: Anti-bot random delay
        run: |
          DELAY=$((RANDOM % 100))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY    
      - run: python main.py run all --session full --mode tweet
      - name: Save weekly log cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ github.run_id }}
          path: |
            data/outputs/core_data.json
            data/images/
          retention-days: 7


          
      - name: Restore DLQ cache
        uses: actions/cache@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}
          restore-keys: dlq-

      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}
          

          
  narrative:
     name: AI Narrative
     if: github.event.schedule == '30 2 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'narrative')
     runs-on: ubuntu-latest
     timeout-minutes: 15
     env:
       TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
       TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
       TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
       FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
       X_API_KEY: ${{ secrets.X_API_KEY }}
       X_API_SECRET: ${{ secrets.X_API_SECRET }}
       X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
       X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
       GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
       GEMINI_API_SUB_KEY: ${{ secrets.GEMINI_API_SUB_KEY }}
       GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
       SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
       SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
     steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install chromium --with-deps
      - name: Restore weekly log cache
        uses: actions/cache@v4
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}
          restore-keys: weekly-log-
      - name: Restore DLQ cache
        uses: actions/cache@v4
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}
          restore-keys: dlq-
      - name: Anti-bot random delay
        run: |
          DELAY=$((RANDOM % 100))
          echo "⏱️ Random delay: ${DELAY}s ($((DELAY/60))m $((DELAY%60))s)"
          sleep $DELAY    
      - run: python main.py run all --session narrative --mode tweet
      - name: Save weekly log cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/weekly_log.json
          key: weekly-log-${{ github.ref }}-${{ github.run_id }}
      - name: Save DLQ cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/published/dlq.json
          key: dlq-${{ github.ref }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrative-${{ github.run_id }}
          path: data/outputs/core_data.json
          retention-days: 3
